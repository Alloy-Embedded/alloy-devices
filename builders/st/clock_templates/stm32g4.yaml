# G4-family clock layer (builder input). Boot-only HSI16 (always safe,
# internal); a curated PLL profile is added when a G4 board is validated in
# silicon, per BUILDERS.md decision 3.
sources:
  hsi16: { hz: 16000000 }
boot_source: hsi16
profiles:
  hsi_16mhz:
    description: HSI16 direct, no PLL, 0 wait states (always-safe internal clock)
    sysclk_hz: 16000000
    ahb_hz: 16000000
    apb_hz: 16000000
    apb2_hz: 16000000
    program:
    - { op: rmw, peripheral: rcc, register: CR, fields: { HSION: 1 } }
    - { op: poll, peripheral: rcc, register: CR, field: HSIRDY, equals: 1, timeout_us: 2000 }
    - { op: rmw, peripheral: flash, register: ACR, fields: { LATENCY: 0 } }
    - { op: rmw, peripheral: rcc, register: CFGR, fields: { SW: 1 } }
    - { op: poll, peripheral: rcc, register: CFGR, field: SWS, equals: 1, timeout_us: 2000 }
