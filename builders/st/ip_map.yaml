# embassy (kind:version[:block]) tag -> our curated registers/st/<ip>, or 'uncurated'.
# Unmapped tags are BUILD ERRORS so new upstream tags surface loudly.
# name_overrides win over tags: LPUART carries usart:v4 tags but its BRR is
# x256 (different baud math) — binding it to usart_v4 would silently program
# the wrong baud rate.
map:
  "gpio:v2": st/gpio_v2
  "usart:v4": st/usart_v4
  "usart:v3": st/usart_v3
  "i2c:v2": st/i2c_v2
