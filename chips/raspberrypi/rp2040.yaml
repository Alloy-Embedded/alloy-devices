schema: alloy.chip.v1
vendor: raspberrypi
family: rp2040
part: RP2040
die: rp2040
provenance:
  sources:
    - 'ADC 2026-08-15: base 0x4004C000, RESETS.RESET bit 0 (reset_release, the RP2040 boots peripherals HELD in reset) and the ADC_IRQ_FIFO vector, all from the vendor SVD raspberrypi/pico-sdk@98a542c1a62fb549ffb5d66a3e5892b06276b670 src/rp2040/hardware_regs/RP2040.svd. The vector number 22 in that SVD matches the ADC_IRQ_FIFO entry already in this file''s interrupt table, which is the cross-check that the base and the vector came from the same part. kernel_clock is recorded as apb because that is the closest node alloy''s clock_node models; the converter is actually fed by clk_adc, a separate 48 MHz output of the clocks block that alloy cannot yet select — a driver must not derive a conversion TIME from this value, and none does.'
    - 'DMA 2026-08-15: base 0x50000000, RESETS.RESET bit 2 (reset_release, same reason as the ADC — this part boots peripherals HELD in reset), 12 channels numbered from 0, and the vectors DMA_IRQ_0 = 11 / DMA_IRQ_1 = 12 — all from the same vendor SVD raspberrypi/pico-sdk@98a542c1a62fb549ffb5d66a3e5892b06276b670 src/rp2040/hardware_regs/RP2040.svd (sha256 1c72330127ae097c8c9a3661b509fcb9a94826d76a5c0d7e259eb605ddd7b0a6). Both vector numbers cross-check against the interrupt table already in this file, which is the evidence the base and the vectors came from the same part. THE THREE dma_requests IDS ARE FROM THE SAME FILE, NOT FROM THE DATASHEET: adc.conv = 36, uart0.tx = 20 and uart0.rx = 21 are enumeratedValues ADC, UART0_TX and UART0_RX on CH0_CTRL_TRIG/TREQ_SEL, and all 45 of that enumeration are transcribed in registers/raspberrypi/dma_v1.yaml, so each id here is checkable against its neighbours rather than free-floating. Only two peripherals carry requests because only two DREQ-driving peripherals are curated on this die at all — SPI, I2C, PIO, PWM and TIMER have DREQ ids in that enumeration and no peripheral entry here to hang them on, and inventing one to hold a number would be data ahead of a driver. kernel_clock is recorded as ahb: the block sits in the AHB-Lite peripheral region as a bus master, and on this part clk_sys feeds the whole fabric, so no timing may be derived from this node and nothing does.'
    - "alloy-devices-yml vendors/raspberrypi pico.yml/rp2040.yml (SVD-derived bases, offsets, IRQs, funcsel per pin)"
    - "RP2040 datasheet §2.15/§2.16/§2.18 (clock bring-up encodings + XOSC magic values — the old YAML's SRC/AUXSRC encodings were wrong and were rejected)"
    - "rp-rs/rp2040-boot2 precompiled boot2_w25q080.padded.bin, sha256 a1408dd2691089af701a1cad19530c539064608566633b9619d15b40d0357b1e (BSD-3-Clause, derived from pico-sdk boot_stage2)"
  verified:
    - "NO RP2040 configuration in the old ecosystem ever ran on hardware (zero-CRC boot2, clocks never written, clk_peri never enabled, IO_BANK0/PADS never released from reset) — everything here is datasheet/SVD-derived and pending first-ever hardware validation"
    - "boot2 CRC-32/MPEG-2 verified: computed == stored == 0x7A4EB274 (also enforced by the validator lint)"
    - "SIO register map triple-confirmed (SVD YAML + old hardware.hpp + example); the old gpio schema header's GPIO_HI_* offsets were a bug"
    - "Flash size 2 MB is the Raspberry Pi Pico board's W25Q080-class chip — RP2040 flash is external; revisit as board-level data when a second RP2040 board lands"
cores:
  - { name: cm0plus, arch: armv6m, fpu: false }
memories:
  - { name: flash, kind: flash, base: "0x10000000", size: 2097152 }
  - { name: sram, kind: ram, base: "0x20000000", size: 270336 }
boot:
  kind: rp2040_boot2
  size: 256
  license: "BSD-3-Clause (pico-sdk boot_stage2 boot2_w25q080, precompiled+checksummed via rp-rs/rp2040-boot2)"
  description: "W25Q080-class QSPI XIP setup; CRC32/MPEG-2 of bytes 0-251 stored little-endian in bytes 252-255"
  payload_hex: ""
peripherals:
  adc:
    ip: raspberrypi/adc
    base: '0x4004C000'
    gate:
      peripheral: resets
      register: RESET
      bit: 0
      style: reset_release
      done_register: RESET_DONE
    irq: ADC_IRQ_FIFO
    kernel_clock: apb
    dma_requests:
      conv: 36
  dma:
    ip: raspberrypi/dma_v1
    base: '0x50000000'
    gate:
      peripheral: resets
      register: RESET
      bit: 2
      style: reset_release
      done_register: RESET_DONE
    # ONE VECTOR IS BOUND AND THE OTHER IS DELIBERATELY NOT. This block raises
    # DMA_IRQ_0 (11) and DMA_IRQ_1 (12), both already in this file's interrupt
    # table, but WHICH channel reaches WHICH line is a runtime software choice
    # (set bit n in INTE0, or INTE1, or both, or neither) rather than silicon
    # geometry. `irq_lines` exists for a controller whose numbered lines are
    # GROUPED onto vectors by the silicon, and spelling this one that way would
    # assert a fixed mapping that does not exist. So the instance names the line
    # a driver policy uses, and the second line stays curated-and-unbound.
    irq: DMA_IRQ_0
    kernel_clock: ahb
    channels:
      count: 12
      # 0-BASED, unlike every DMA controller in the tree so far except the F4/F7
      # streams. The channels are CH0..CH11 in the silicon, in pico-sdk and in
      # every RP2040 example anyone will read, so `first` records the base as
      # data instead of renumbering the part to suit a consumer.
      first: 0
  resets:
    ip: raspberrypi/resets
    base: "0x4000C000"
  clocks:
    ip: raspberrypi/clocks
    base: "0x40008000"
  xosc:
    ip: raspberrypi/xosc
    base: "0x40024000"
  pll_sys:
    ip: raspberrypi/pll
    base: "0x40028000"
  sio:
    ip: raspberrypi/sio
    base: "0xD0000000"
  pads_bank0:
    ip: raspberrypi/pads_bank0
    base: "0x4001C000"
    gate: { peripheral: resets, register: RESET, bit: 8, style: reset_release, done_register: RESET_DONE }
  io_bank0:
    ip: raspberrypi/io_bank0
    base: "0x40014000"
    gate: { peripheral: resets, register: RESET, bit: 5, style: reset_release, done_register: RESET_DONE }
    irq: IO_IRQ_BANK0
    companions: { sio: sio, pads: pads_bank0 }
  uart0:
    ip: raspberrypi/uart_pl011
    base: "0x40034000"
    gate: { peripheral: resets, register: RESET, bit: 22, style: reset_release, done_register: RESET_DONE }
    irq: UART0_IRQ
    kernel_clock: apb
    dma_requests:
      rx: 21
      tx: 20
    feat:
      rx_fifo_depth: 32
      tx_fifo_depth: 32
pins:
  pa0: { port: a, index: 0, bank: io_bank0 }
  pa1: { port: a, index: 1, bank: io_bank0 }
  pa16: { port: a, index: 16, bank: io_bank0 }
  pa25: { port: a, index: 25, bank: io_bank0 }
routes:
  - { pin: pa0, peripheral: uart0, signal: tx, kind: funcsel, funcsel: 2 }
  - { pin: pa1, peripheral: uart0, signal: rx, kind: funcsel, funcsel: 2 }
interrupts:
  - { name: TIMER_IRQ_0, number: 0 }
  - { name: TIMER_IRQ_1, number: 1 }
  - { name: TIMER_IRQ_2, number: 2 }
  - { name: TIMER_IRQ_3, number: 3 }
  - { name: PWM_IRQ_WRAP, number: 4 }
  - { name: USBCTRL_IRQ, number: 5 }
  - { name: XIP_IRQ, number: 6 }
  - { name: PIO0_IRQ_0, number: 7 }
  - { name: PIO0_IRQ_1, number: 8 }
  - { name: PIO1_IRQ_0, number: 9 }
  - { name: PIO1_IRQ_1, number: 10 }
  - { name: DMA_IRQ_0, number: 11 }
  - { name: DMA_IRQ_1, number: 12 }
  - { name: IO_IRQ_BANK0, number: 13 }
  - { name: IO_IRQ_QSPI, number: 14 }
  - { name: SIO_IRQ_PROC0, number: 15 }
  - { name: SIO_IRQ_PROC1, number: 16 }
  - { name: CLOCKS_IRQ, number: 17 }
  - { name: SPI0_IRQ, number: 18 }
  - { name: SPI1_IRQ, number: 19 }
  - { name: UART0_IRQ, number: 20 }
  - { name: UART1_IRQ, number: 21 }
  - { name: ADC_IRQ_FIFO, number: 22 }
  - { name: I2C0_IRQ, number: 23 }
  - { name: I2C1_IRQ, number: 24 }
  - { name: RTC_IRQ, number: 25 }
clock:
  sources:
    rosc: { hz: 6500000 }
    xosc12m: { hz: 12000000 }
  boot_source: rosc
  profiles:
    pll_125mhz:
      description: >
        Datasheet-canonical bring-up (never existed in the old ecosystem):
        park clk_sys on clk_ref, start XOSC (12 MHz, startup delay 47),
        clk_ref -> xosc, release PLL_SYS from reset, REFDIV=1 FBDIV=125
        (VCO 1500 MHz), power up, wait LOCK, postdivs 6/2 -> 125 MHz,
        clk_sys -> pll_sys via aux, enable clk_peri from clk_sys.
      sysclk_hz: 125000000
      ahb_hz: 125000000
      apb_hz: 125000000
      program:
        - { op: rmw, peripheral: clocks, register: CLK_SYS_CTRL, fields: { SYS_SRC: 0 } }
        - { op: poll, peripheral: clocks, register: CLK_SYS_SELECTED, field: SYS_SEL_REF, equals: 1, timeout_us: 1000 }
        - { op: rmw, peripheral: xosc, register: STARTUP, fields: { DELAY: 47 } }
        - { op: rmw, peripheral: xosc, register: CTRL, fields: { FREQ_RANGE: 2720 } }
        - { op: rmw, peripheral: xosc, register: CTRL, fields: { ENABLE: 4011 } }
        - { op: poll, peripheral: xosc, register: STATUS, field: STABLE, equals: 1, timeout_us: 50000 }
        - { op: rmw, peripheral: clocks, register: CLK_REF_CTRL, fields: { REF_SRC: 2 } }
        - { op: poll, peripheral: clocks, register: CLK_REF_SELECTED, field: REF_SEL_XOSC, equals: 1, timeout_us: 1000 }
        - { op: rmw, peripheral: resets, register: RESET, fields: { PLL_SYS: 0 } }
        - { op: poll, peripheral: resets, register: RESET_DONE, field: DONE_PLL_SYS, equals: 1, timeout_us: 1000 }
        - { op: rmw, peripheral: pll_sys, register: CS, fields: { REFDIV: 1 } }
        - { op: rmw, peripheral: pll_sys, register: FBDIV_INT, fields: { FBDIV: 125 } }
        - { op: rmw, peripheral: pll_sys, register: PWR, fields: { PD: 0, VCOPD: 0 } }
        - { op: poll, peripheral: pll_sys, register: CS, field: LOCK, equals: 1, timeout_us: 10000 }
        - { op: rmw, peripheral: pll_sys, register: PRIM, fields: { POSTDIV1: 6, POSTDIV2: 2 } }
        - { op: rmw, peripheral: pll_sys, register: PWR, fields: { POSTDIVPD: 0 } }
        - { op: rmw, peripheral: clocks, register: CLK_SYS_CTRL, fields: { SYS_AUXSRC: 0 } }
        - { op: rmw, peripheral: clocks, register: CLK_SYS_CTRL, fields: { SYS_SRC: 1 } }
        - { op: poll, peripheral: clocks, register: CLK_SYS_SELECTED, field: SYS_SEL_AUX, equals: 1, timeout_us: 1000 }
        - { op: rmw, peripheral: clocks, register: CLK_PERI_CTRL, fields: { PERI_AUXSRC: 0, PERI_ENABLE: 1 } }
