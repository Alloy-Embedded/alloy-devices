provenance:
  sources:
  - "alloy-devices-yml vendors/microchip/same70/devices/atsame70q21b.yml (SVD-derived) \u2014 bases, PIDs,\
    \ IRQs, register templates"
  - "old-alloy git 8b1b1bc7^ .alloy-devices-patched system_clock.hpp/routes.hpp/clock_bindings.hpp \u2014\
    \ hardware-validated clock sequence + pin functions"
  - "old-alloy git 7559c143 boards/same70_xplained (commit 'validate uart-backed hardware probes') \u2014\
    \ WDT disable, CCFG_SYSIO, USART1 8N1 config"
  - 'peripheral mining 2026-07-22: TWIHS0/AFEC0 bases+PIDs from canonical yml; PA4=TWCK0/PA3=TWD0 function
    A from hardware-era routes.hpp; temp sensor = AFEC0 ch11; COCR mid-scale quirk'
  - 'SPI0 mining 2026-07-22: base 0x40008000 / PID 21 (PCER0 bit 21, matches interrupts SPI0=21) from canonical yml; PD20/PD21/PD22 = MISO/MOSI/SPCK peripheral B (selector 1) from old-alloy git 8b1b1bc7^ generated routes.hpp write_selector operands (PD20=1 PD21=1 PD22=1 = function B; same source style as the TWIHS0 line) + board.json spi block (Xplained EXT/Arduino headers); CSR modeled as 4-entry array (old hw()->CSR[cs]; canonical yml collapsed it — mining quirk spi-csr-array)'
  verified:
  - "PID == NVIC line; PID 7..31 gate via PCER0 (write-only set-register), 32..63 via PCER1 \u2014 gates\
    \ here use style write_set"
  - "WDT and RSWDT run at reset with write-once MR \u2014 the clock program disables both FIRST (the newer\
    \ old-repo codegen forgot this; the hardware-validated legacy board.cpp did it)"
  - "PB4 = USART1 TXD1 is peripheral function D and needs MATRIX CCFG_SYSIO bit 4 (JTAG TDI release) \u2014\
    \ modeled as route af=3 + pin mux_unlock (the old lite codegen wrongly used function A and skipped\
    \ SYSIO)"
  - "Validated profile is 150 MHz (PLLA 300 / PRES 2, MDIV=EQ_PCK so CPU==MCK). The 300 MHz max profile\
    \ was never hardware-validated in the old ecosystem \u2014 not seeded"
  - Boot clock is the 4 MHz internal RC (MOSCRCF reset value 0), per canonical factory-mainck-rc-4mhz
    profile
  - "Old YAML claimed PCLK 75 MHz for this profile; hardware-validated contract used 150 MHz and the working\
    \ UART BRGR proves it \u2014 150 MHz seeded"
