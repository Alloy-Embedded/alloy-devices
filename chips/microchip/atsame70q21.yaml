clock:
  sources:
    rc4m:
      hz: 4000000
    xtal12m:
      hz: 12000000
  boot_source: rc4m
  profiles:
    plla_150mhz:
      description: 'Hardware-validated bring-up (old-alloy 7559c143/8b1b1bc7^): disable write-once watchdogs
        FIRST, start 12 MHz crystal, FWS=6, PLLA 12*25=300 MHz, MCK = 300/2 = 150 MHz with the mandatory
        MCKR step-by-step (CSS=MAIN, PRES, MDIV, CSS=PLLA, MCKRDY poll between each). CPU == MCK == 150
        MHz (MDIV=EQ_PCK).

        '
      sysclk_hz: 150000000
      ahb_hz: 150000000
      apb_hz: 150000000
      program:
      - op: write
        peripheral: wdt
        register: MR
        value: '0x0FFF8000'
      - op: write
        peripheral: rswdt
        register: MR
        value: '0x0FFF8000'
      - op: write
        peripheral: pmc
        register: CKGR_MOR
        value: '0x0037FF29'
      - op: poll
        peripheral: pmc
        register: SR
        field: MOSCXTS
        equals: 1
        timeout_us: 100000
      - op: write
        peripheral: pmc
        register: CKGR_MOR
        value: '0x0137FF29'
      - op: poll
        peripheral: pmc
        register: SR
        field: MOSCSELS
        equals: 1
        timeout_us: 100000
      - op: rmw
        peripheral: efc
        register: FMR
        fields:
          FWS: 6
      - op: write
        peripheral: pmc
        register: CKGR_PLLAR
        value: '0x20183F01'
      - op: poll
        peripheral: pmc
        register: SR
        field: LOCKA
        equals: 1
        timeout_us: 20000
      - op: rmw
        peripheral: pmc
        register: MCKR
        fields:
          CSS: 1
      - op: poll
        peripheral: pmc
        register: SR
        field: MCKRDY
        equals: 1
        timeout_us: 20000
      - op: rmw
        peripheral: pmc
        register: MCKR
        fields:
          PRES: 1
      - op: poll
        peripheral: pmc
        register: SR
        field: MCKRDY
        equals: 1
        timeout_us: 20000
      - op: rmw
        peripheral: pmc
        register: MCKR
        fields:
          MDIV: 0
      - op: poll
        peripheral: pmc
        register: SR
        field: MCKRDY
        equals: 1
        timeout_us: 20000
      - op: rmw
        peripheral: pmc
        register: MCKR
        fields:
          CSS: 2
      - op: poll
        peripheral: pmc
        register: SR
        field: MCKRDY
        equals: 1
        timeout_us: 20000
