provenance:
  sources:
  - alloy-devices-yml vendors/microchip/same70/devices/atsame70q21b.yml (SVD-derived) — bases, PIDs, IRQs,
    register templates
  - old-alloy git 8b1b1bc7^ .alloy-devices-patched system_clock.hpp/routes.hpp/clock_bindings.hpp — hardware-validated
    clock sequence + pin functions
  - old-alloy git 7559c143 boards/same70_xplained (commit 'validate uart-backed hardware probes') — WDT
    disable, CCFG_SYSIO, USART1 8N1 config
  - 'peripheral mining 2026-07-22: TWIHS0/AFEC0 bases+PIDs from canonical yml; PA4=TWCK0/PA3=TWD0 function
    A from hardware-era routes.hpp; temp sensor = AFEC0 ch11; COCR mid-scale quirk'
  - 'SPI0 mining 2026-07-22: base 0x40008000 / PID 21 (PCER0 bit 21, matches interrupts SPI0=21) from
    canonical yml; PD20/PD21/PD22 = MISO/MOSI/SPCK peripheral B (selector 1) from old-alloy git 8b1b1bc7^
    generated routes.hpp write_selector operands (PD20=1 PD21=1 PD22=1 = function B; same source style
    as the TWIHS0 line) + board.json spi block (Xplained EXT/Arduino headers); CSR modeled as 4-entry
    array (old hw()->CSR[cs]; canonical yml collapsed it — mining quirk spi-csr-array)'
  - 'IC inventory 2026-07-22 (Atmel-44050A user guide): PC11 = AT24MAC402 WP (low = writable), PD25 =
    SPI0 NPCS1 on EXT1 pin 15 (used as GPIO software CS); 0x37 do scan = alias write-protect do proprio
    AT24MAC402, nao um segundo EDBG endpoint'
  - 'XDMAC mining 2026-07-22: base 0x40078000 / PID 58 -> PCER1 bit 26 from canonical yml (irq XDMAC ja
    na lista); PERIDs do enum CC.PERID canonico (52 entradas): USART1_TX=9/RX=10, AFEC0=35; 24 canais
    corroborados por GSWR swreq0..23 + datasheet (geometria 0x50/stride 0x40 e datasheet-only)'
  - 'XDMAC PERID completion 2026-08-15: SPI0_TX=1/SPI0_RX=2 e TWIHS0_TX=14/TWIHS0_RX=15 lidos do value-group
    XDMAC_CC__PERID do ATSAME70Q21B.atdf dentro do pack fixado same70-dfp-4.9.129.atpack (sha256 confere com
    builders/microchip/sources.lock), o MESMO enum canonico que ja tinha dado USART1_TX=9/RX=10 e AFEC0=35 —
    spi0/twihs0 tinham ficado sem dma_requests na mineracao de 2026-07-22'
  - same70-dfp-4.9.129.atpack ATSAME70Q21B.atdf <pinouts>/LQFP144 (Apache-2.0 (SPDX-License-Identifier
    in every ATDF; Copyright (c) 2017 Microchip Technology Inc.)) — physical pinout, accepted by the pinout
    plausibility lint
  verified:
  - PID == NVIC line; PID 7..31 gate via PCER0 (write-only set-register), 32..63 via PCER1 — gates here
    use style write_set
  - WDT and RSWDT run at reset with write-once MR — the clock program disables both FIRST (the newer old-repo
    codegen forgot this; the hardware-validated legacy board.cpp did it)
  - PB4 = USART1 TXD1 is peripheral function D and needs MATRIX CCFG_SYSIO bit 4 (JTAG TDI release) —
    modeled as route af=3 + pin mux_unlock (the old lite codegen wrongly used function A and skipped SYSIO)
  - Validated profile is 150 MHz (PLLA 300 / PRES 2, MDIV=EQ_PCK so CPU==MCK). The 300 MHz max profile
    was never hardware-validated in the old ecosystem — not seeded
  - Boot clock is the 4 MHz internal RC (MOSCRCF reset value 0), per canonical factory-mainck-rc-4mhz
    profile
  - Old YAML claimed PCLK 75 MHz for this profile; hardware-validated contract used 150 MHz and the working
    UART BRGR proves it — 150 MHz seeded
