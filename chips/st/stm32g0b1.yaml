schema: alloy.chip.v1
vendor: st
family: stm32g0
part: STM32G0B1RE
die: stm32g0b1
provenance:
  sources:
  - alloy-devices-yml vendors/st/stm32g0/devices/stm32g0b1re.yml (SVD cmsis-svd:STM32G0B1.svd + stm32-open-pin-data)
  - alloy-devices-yml bulk-admitted stm32g0b1retx.yml 1.2.0/1.3.0 (memories 524288/147456; PA2/PA3 AF1
    USART2)
  - "old-alloy boards/nucleo_g0b1re/board.json + git 7e1a52f8 generated device.ld (0x80000/0x24000 \u2014\
    \ 4 sources agree)"
  - IP registers shared with stm32g071rb (same gpio_v2/usart_v4/rcc_g0/flash_g0 layouts per SVD-derived
    templates)
  - 'peripheral mining 2026-07-22: TIM2/ADC bases+gates from canonical yml; PA5->TIM2_CH1 AF2 from bulk
    1.3.0 AF tables; vrefint=ch13 (CAL 0x1FFF75AA), temp=ch12'
  - 'I2C1 mining 2026-07-22: base/gate from canonical yml; PB8/PB9 AF6 (Arduino D15/D14) from bulk 1.3.0'
  - 'SPI1 mining 2026-07-22: base/gate mirror of g071rb (ip_version spi2s1_v3_5_Cube on G0B1, same
    register subset); PB3/PB4/PB5 AF0 from bulk 1.3.0 stm32g0b1r(b-c-e)tx.yml — identical AF0 set'
  - 'EXTI mining 2026-08-07: EXTI base 0x40021800 and the line->vector grouping (0-1 EXTI0_1, 2-3 EXTI2_3, 4-15 EXTI4_15) read from builders/st/cache/669003ee.../data_chips_STM32G0B1CB.json (EXTI address 1073879040 + its 16-entry signal->interrupt table, identical to the G071); gpio port_index values are the EXTICR port codes from ST cmsis_device_g0 (A=0..F=5) — this die HAS port E, so the numbering is dense 0..5'
  - 'DMA mining 2026-07-22: DMA1 7ch @0x40020000 (AHBENR bit 0) + DMAMUX @0x40020800 (clocked with DMA1, no own gate) from canonical yml; request IDs ADC=5, TIM2_CH1/UP=26/31, USART2_RX/TX=52/53 from RM0444 §11 table (Zephyr overlay cross-checks); DMA IRQ grouping 9/10/11'
  verified:
  - "New chip added with ZERO new C++ and ZERO emitter changes \u2014 the 'new chip = data only' proof"
  - Same hardware-verified PLL profile as stm32g071rb (HSI16 /1 x8 /2 = 64 MHz, 2WS); the old generated
    kPllR=0 raw-value bug avoided again (PLLR field=1 for /2)
  - 'IRQ lines re-shared vs G071 (31 lines): USART2 lives on line 28 as USART2_LPUART2; RCC gains CRS
    on line 4'
  - GPIOE exists on G0B1 (IOPENR bit 4) unlike G071
