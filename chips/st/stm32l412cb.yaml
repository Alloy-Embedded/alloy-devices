clock:
  sources:
    msi:
      hz: 4000000
    hsi16:
      hz: 16000000
    lsi:
      hz: 32000
  boot_source: msi
  profiles:
    msi_4mhz:
      description: "MSI boot oscillator as-is, 0 wait states \u2014 the always-safe default"
      sysclk_hz: 4000000
      ahb_hz: 4000000
      apb_hz: 4000000
      apb2_hz: 4000000
      program:
      - op: rmw
        peripheral: rcc
        register: CR
        fields:
          MSION: 1
      - op: poll
        peripheral: rcc
        register: CR
        field: MSIRDY
        equals: 1
        timeout_us: 2000
      - op: rmw
        peripheral: flash
        register: ACR
        fields:
          LATENCY: 0
      - op: rmw
        peripheral: rcc
        register: CFGR
        fields:
          SW: 0
      - op: poll
        peripheral: rcc
        register: CFGR
        field: SWS
        equals: 0
        timeout_us: 2000
    pll_64mhz:
      description: "HSI16 /1 x16 /4 = 64 MHz via PLLR, 3 wait states (RM0394 table 9 for 64 MHz at range 1;\
        \ same shape as the silicon-proven G0 64 MHz recipe)"
      sysclk_hz: 64000000
      ahb_hz: 64000000
      apb_hz: 64000000
      apb2_hz: 64000000
      program:
      - op: rmw
        peripheral: rcc
        register: CR
        fields:
          HSION: 1
      - op: poll
        peripheral: rcc
        register: CR
        field: HSIRDY
        equals: 1
        timeout_us: 2000
      - op: rmw
        peripheral: flash
        register: ACR
        fields:
          LATENCY: 3
      - op: rmw
        peripheral: rcc
        register: PLLCFGR
        fields:
          PLLSRC: 2
          PLLM: 0
          PLLN: 16
          PLLR: 1
