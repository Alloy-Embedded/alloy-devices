provenance:
  sources:
  - "builders/st (embassy-rs/stm32-data-generated @ 669003eeb7ad, MIT OR Apache-2.0 via stm32-metapac)\
    \ \u2014 bases, RCC gates, IRQs, pin AFs, DMA requests, memories, ip tags \u2014 then hand-curated:\
    \ this file is the first stm32l4 in the database"
  - clock profiles from builders/st/clock_templates/stm32l4.yaml
  verified:
  - "DATA-verified, silicon pending (no L4 board has run alloy yet): gates/IRQs cross-checked against\
    \ the ST CMSIS device header (stm32l412xx.h) and RM0394; USART2EN=APB1ENR1.17, USART3EN=.18,\
    \ TSCEN=AHB1ENR.16 confirmed both sides"
  - "RAM 40K = SRAM1 32K + SRAM2 8K contiguous at 0x20000000 per the RM0394 memory map (SRAM2_ICODE\
    \ at 0x10000000 is an alias, excluded)"
  - "pll_64mhz is the standard L4 HSI16 /1 x16 /4 recipe with 3 WS per RM0394 table 9"
  - "iwdg hand-mapped to st/iwdg_v2 (shared ip_map entry stays uncurated to avoid churning every generated\
    \ F4/F7/G4 yaml); same shape as the verified stm32g071rb entry"
