schema: alloy.chip.v1
vendor: st
family: stm32g0
part: STM32G071RB
die: stm32g071
provenance:
  sources:
  - "alloy-devices-yml vendors/st/stm32g0/devices/stm32g071rb.yml (SVD cmsis-svd:STM32G071.svd) \u2014\
    \ bases, IRQs, gate bits"
  - "alloy-devices-yml bulk-admitted stm32g071r(6-8-b)tx.yml schema 1.3.0 (stm32-open-pin-data) \u2014 pin AF\
    \ routes"
  - "old-alloy boards/nucleo_g071rb/board.json + generated linker.ld \u2014 memory sizes 128K/36K"
  - "old-alloy commit 6d47f2cb \u2014 PLL bring-up sequence order, hardware-verified on Nucleo-G071RB"
  - 'RM0444 divider semantics: PLLM divider=field+1, PLLN multiplier=field, PLLR divider=field+1 (min
    /2)'
  - 'peripheral mining 2026-07-22: TIM2/ADC bases+gates from canonical yml; PA5->TIM2_CH1 AF2 from bulk
    1.3.0 AF tables; vrefint=ch13 (CAL 0x1FFF75AA), temp=ch12'
  - 'I2C1 mining 2026-07-22: base/gate from canonical yml; PB8/PB9 AF6 (Arduino D15/D14) from bulk 1.3.0'
  - 'SPI1 mining 2026-07-22: base/gate (APBENR2 bit 12) from canonical yml; PB3/PB4/PB5 AF0 from bulk
    1.3.0 — set hardware-exercised on real Nucleo-G071RB by old-alloy lite_hal_probe; PA5/PA6/PA7 AF0
    exist too but PA5 = LD4 LED (deliberately not routed to keep the LED role alive)'
  - 'EXTI mining 2026-08-07: EXTI base 0x40021800 and the line->vector grouping (0-1 EXTI0_1, 2-3 EXTI2_3, 4-15 EXTI4_15) read from builders/st/cache/669003ee.../data_chips_STM32G071RB.json (EXTI address 1073879040 + its 16-entry signal->interrupt table); gpio port_index values are the EXTICR port codes from ST cmsis_device_g0 stm32g071xx.h (A=0..F=5) — note this die has NO port E, so gpiof is 5, not 4'
  - 'DMA mining 2026-07-22: DMA1 7ch @0x40020000 (AHBENR bit 0) + DMAMUX @0x40020800 (clocked with DMA1, no own gate) from canonical yml; request IDs ADC=5, TIM2_CH1/UP=26/31, USART2_RX/TX=52/53 from RM0444 §11 table (Zephyr overlay cross-checks); DMA IRQ grouping 9/10/11'
  verified:
  - "Memories: yml claimed family-max 512K/144K and self-flags 'requires enrichment'; part code 'RB'=128K\
    \ and two independent old-alloy sources agree on 128K/36K \u2014 128K/36K seeded"
  - "PLL 64 MHz raw fields judged: PLLSRC=2 (HSI16), PLLM=0 (/1), PLLN=8 (x8, VCO=128MHz in 64-344 range),\
    \ PLLR=1 (/2), PLLREN=1, latency=2WS \u2014 16/1*8/2 = 64 MHz"
  - The old generated runtime_init.c wrote semantic dividers into raw fields and never set PLLREN (two
    codegen bugs found during mining, both avoided here)
  - GPIOC gate = IOPENR bit 2 (the old generated gate table dropped it; user button is PC13)
  - "Cortex-M0+ with 2 NVIC priority bits (old yml said cm0/4 bits \u2014 judged wrong for M0+)"
