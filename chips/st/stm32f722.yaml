provenance:
  sources:
  - 'alloy-devices-yml bulk-admitted stm32f722zetx.yml (Keil STM32F7xx_DFP 3.1.1 SVD: memories, bases,
    interrupts) + stm32f7x2.yml (cmsis-svd-data: interrupt list cross-check)'
  - old-alloy git b2f319c2^ generated stm32f7 register headers (rcc/flash/usart3/gpiob — SVD-derived)
    + clock_platform.hpp cross-check
  - 'SPI1 mining 2026-07-22: base 0x40013000 from Keil DFP SVD; APB2ENR.SPI1EN bit 12 (rcc_f7.yaml); PA5/PA6/PA7
    AF5 from bulk 1.3.0 stm32f730z8tx sibling (no 1.3.0 pin file for f722 - same caveat as USART3 PD8/PD9);
    apb2_hz=90MHz added (PPRE2=4 -> 180/2), SPI1 is the first APB2 consumer'
  - 'alloy-devices-yml bulk-admitted stm32f730z8tx.yml 1.3.0 (sibling F73x Z-package: PD8/PD9 AF7 USART3
    — no 1.3.0 file exists for f722 itself)'
  - old-alloy git e4864c0f boards/nucleo_f722ze (clock profile HSE8 M4 N180 P2 latency 5 — the only in-repo
    F7 clock recipe; board WIRING rejected as a Nucleo-64 copy-paste, see verified)
  - embassy-rs/stm32-data-generated@669003ee data/chips/STM32F722ZE.json packages[] (MIT OR Apache-2.0;
    derived from ST STM32_open_pin_data BSD-3) — physical pinout, accepted by the pinout plausibility
    lint
  verified:
  - SRAM modeled as one contiguous 256K region at 0x20000000 (DTCM 64K + SRAM1 176K + SRAM2 16K are address-contiguous
    on F7; the old linker did the same)
  - F7 GPIO is gpio_v2 WITHOUT the BRR register — our driver never touches BRR; the overlay's trailing
    BRR member is simply never accessed
  - USART v3 = v4 layout minus PRESC, same field positions for the driver subset (SVD-confirmed)
  - 180 MHz profile stays within reset VOS scale-1 (no overdrive sequence needed); 216 MHz deliberately
    NOT seeded — needs the RM0431 PWR overdrive dance, unproven anywhere in the old ecosystem
  - 'Old nucleo_f722ze board files claimed USART2/PA2-PA3 VCP and one green LED on PB7 — Nucleo-64 template
    copy-paste; Nucleo-144 wiring (UM1974): LD1 green PB0, LD2 blue PB7, LD3 red PB14, B1 PC13, VCP USART3
    PD8/PD9 AF7'
