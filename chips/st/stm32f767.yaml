schema: alloy.chip.v1
vendor: st
family: stm32f7
part: STM32F767ZI
die: stm32f767
provenance:
  sources:
  - 'TIM1 2026-08-15: the advanced-control timer, promoted into this curated short
    chip file from the bulk-admitted sibling (stm32f767zi.yaml). base 0x40010000,
    APB2ENR bit 0 and irq TIM1_BRK_TIM9 are the sibling''s, which took them from the
    Keil SVD this file already cites; kernel_clock apb2 is PCLK2_TIM in
    embassy-rs/stm32-data-generated@669003ee data/chips/STM32F767ZI.json. The twelve
    routes are that same JSON''s TIM1 pin list, filtered to the pins THIS file
    declares — PE8/PE10/PE12/PE15 carry the same signals on the die and are dropped
    because this package does not bring them out. `ip: st/tim_adv_v1` is the timer:v1
    TIM_ADV template, whose ten curated registers were compared field by field against
    the pinned upstream and differ from the G0-era st/tim_adv in exactly one place
    (OCxM is three bits here, four there). NOTHING HERE HAS BEEN SEEN ON SILICON.'
  - 'ADC 2026-08-15: adc1 + its shared common block, promoted into this curated short chip file from the bulk-admitted sibling (stm32f767zi.yaml), where the same three facts (base 0x40012000, APB2ENR bit 8, irq ADC) came from the Keil SVD this file already cites. kernel_clock apb2 and the common-block companion are from embassy-rs/stm32-data-generated@669003ee data/chips/STM32F767ZI.json (rcc.kernel_clock = PCLK2; ADC123_COMMON at 0x40012300). NO channels: map — nothing in either source gives this part''s VREFINT/temperature channel NUMBERS, and a guessed one would be a generated lie, so internal channels stay unreachable and board::adc_has_vref is false rather than wrong.'
  - 'alloy-devices-yml bulk-admitted stm32f767zitx.yml (Keil STM32F7xx_DFP SVD: memories, bases, interrupts
    incl. ETH=61/ETH_WKUP=62) + stm32f7x7.yml interrupt cross-check'
  - curated chips/st/stm32f722.yaml (sibling F7 short chip file) — rcc_f7/flash_f7/gpio_v2/usart_v3/iwdg_v2
    IP versions, pll_180mhz overdrive-free recipe, SRAM/flash model
  - RM0410 §Ethernet + curated registers/st/eth_v1.yaml — ETH base 0x40028000, AHB1ENR.ETHMACEN bit 25,
    RMII bank AF11
  - Nucleo-F767ZI UM1974 / MB1137 — RMII wiring PA1/PA2/PC1/PA7/PC4/PC5/PG11/PG13/PB13, LD1 green PB0,
    B1 PC13, VCP USART3 PD8/PD9 AF7
  - embassy-rs/stm32-data-generated@669003ee data/chips/STM32F767ZI.json packages[] (MIT OR Apache-2.0;
    derived from ST STM32_open_pin_data BSD-3) — physical pinout, accepted by the pinout plausibility
    lint
  - 'DMA mining 2026-08-14: dma1/dma2 on st/dma_v2 (bases 0x40026000/0x40026400, AHB1ENR bits 21/22,
    one NVIC vector per stream) + dma_routes triples for usart3 (the debug_uart anchor) — every triple
    cross-checked against the builder-generated sibling stm32f767bi.yaml (same die, pinned embassy SHA)
    AND the RM0410 §8.3 DMA1/DMA2 request mapping tables; streams are 0-based per ST stream numbering
    (unlike dma_v1''s 1-based channels); F76x CHSEL is the 4-bit variant (requests reach 9 on this die),
    modeled at that width in registers/st/dma_v2.yaml'
  verified:
  - 'SRAM modeled as one contiguous 512K region at 0x20000000 (DTCM 128K + SRAM1 368K + SRAM2 16K are
    address-contiguous on F7). RISK for ETH: the ETH DMA is an AHB master and CANNOT reach DTCM (0x20000000..0x2001FFFF)
    — the ETH descriptor rings/buffers must link into SRAM1 @ 0x20020000; base this region there (or add
    a dedicated .eth_ram section) before silicon bring-up'
  - F7 GPIO is gpio_v2, USART v3 = v4 minus PRESC — same driver subset as F722 (SVD-confirmed)
  - 180 MHz profile stays within reset VOS scale-1 (no overdrive); 216 MHz deliberately NOT seeded (needs
    the RM0410 PWR overdrive dance). 180 MHz HCLK -> ETH MACMIIAR.CR=0b100 (HCLK/102, MDC 1.76 MHz <=
    2.5 MHz)
  - 'ETH needs THREE AHB1ENR bits (25 ETHMACEN + 26 ETHMACTXEN + 27 ETHMACRXEN); the schema gate holds
    only bit 25, the st_eth_v1 HAL sets 26/27 in begin_mdio(). SYSCFG.MII_RMII_SEL + SYSCFGEN are also
    set by the HAL (RM0410 ordering: RMII select BEFORE the ETH MAC clock)'
