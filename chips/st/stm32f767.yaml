clock:
  sources:
    hsi16:
      hz: 16000000
    hse8m:
      hz: 8000000
  boot_source: hsi16
  profiles:
    pll_180mhz:
      description: 'HSE 8 MHz (ST-Link MCO) / M=4 (2 MHz) x N=180 (VCO 360 MHz) / P=2 = 180 MHz sysclk,
        AHB /1, APB1 /4 (45 MHz), APB2 /2 (90 MHz), 5 wait states. Stays within reset VOS scale-1 — no
        overdrive. Same overdrive-free F7 recipe as nucleo_f722ze; prescalers set BEFORE the switch to
        PLL. RMII REF_CLK is the external 50 MHz from the LAN8742A, independent of this profile.

        '
      sysclk_hz: 180000000
      ahb_hz: 180000000
      apb_hz: 45000000
      apb2_hz: 90000000
      program:
      # The 8 MHz is a DRIVEN clock from the ST-Link MCO, not a crystal: HSEBYP
      # selects the bypass input, and it is writable only while HSEON is clear,
      # so it must come first. Without it the MCU enables its oscillator
      # inverter against a CMOS clock source — out of spec, and the failure is a
      # board that boots on HSI at the wrong speed instead of refusing.
      - op: rmw
        peripheral: rcc
        register: CR
        fields:
          HSEBYP: 1
      - op: rmw
        peripheral: rcc
        register: CR
        fields:
          HSEON: 1
      - op: poll
        peripheral: rcc
        register: CR
        field: HSERDY
        equals: 1
        timeout_us: 100000
      - op: rmw
        peripheral: flash
        register: ACR
        fields:
          LATENCY: 5
          ARTEN: 1
          PRFTEN: 1
      - op: rmw
        peripheral: rcc
        register: PLLCFGR
        fields:
          PLLM: 4
          PLLN: 180
          PLLP: 0
          PLLSRC: 1
          PLLQ: 8
      - op: rmw
        peripheral: rcc
        register: CFGR
        fields:
          PPRE1: 5
          PPRE2: 4
      - op: rmw
        peripheral: rcc
        register: CR
        fields:
          PLLON: 1
      - op: poll
        peripheral: rcc
        register: CR
        field: PLLRDY
        equals: 1
        timeout_us: 10000
      - op: rmw
        peripheral: rcc
        register: CFGR
        fields:
          SW: 2
      - op: poll
        peripheral: rcc
        register: CFGR
        field: SWS
        equals: 2
        timeout_us: 10000
