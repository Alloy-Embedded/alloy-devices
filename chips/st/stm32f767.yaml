schema: alloy.chip.v1
vendor: st
family: stm32f7
part: STM32F767ZI
die: stm32f767
provenance:
  sources:
    - "alloy-devices-yml bulk-admitted stm32f767zitx.yml (Keil STM32F7xx_DFP SVD: memories, bases, interrupts incl. ETH=61/ETH_WKUP=62) + stm32f7x7.yml interrupt cross-check"
    - "curated chips/st/stm32f722.yaml (sibling F7 short chip file) — rcc_f7/flash_f7/gpio_v2/usart_v3/iwdg_v2 IP versions, pll_180mhz overdrive-free recipe, SRAM/flash model"
    - "RM0410 §Ethernet + curated registers/st/eth_v1.yaml — ETH base 0x40028000, AHB1ENR.ETHMACEN bit 25, RMII bank AF11"
    - "Nucleo-F767ZI UM1974 / MB1137 — RMII wiring PA1/PA2/PC1/PA7/PC4/PC5/PG11/PG13/PB13, LD1 green PB0, B1 PC13, VCP USART3 PD8/PD9 AF7"
  verified:
    - "SRAM modeled as one contiguous 512K region at 0x20000000 (DTCM 128K + SRAM1 368K + SRAM2 16K are address-contiguous on F7). RISK for ETH: the ETH DMA is an AHB master and CANNOT reach DTCM (0x20000000..0x2001FFFF) — the ETH descriptor rings/buffers must link into SRAM1 @ 0x20020000; base this region there (or add a dedicated .eth_ram section) before silicon bring-up"
    - "F7 GPIO is gpio_v2, USART v3 = v4 minus PRESC — same driver subset as F722 (SVD-confirmed)"
    - "180 MHz profile stays within reset VOS scale-1 (no overdrive); 216 MHz deliberately NOT seeded (needs the RM0410 PWR overdrive dance). 180 MHz HCLK -> ETH MACMIIAR.CR=0b100 (HCLK/102, MDC 1.76 MHz <= 2.5 MHz)"
    - "ETH needs THREE AHB1ENR bits (25 ETHMACEN + 26 ETHMACTXEN + 27 ETHMACRXEN); the schema gate holds only bit 25, the st_eth_v1 HAL sets 26/27 in begin_mdio(). SYSCFG.MII_RMII_SEL + SYSCFGEN are also set by the HAL (RM0410 ordering: RMII select BEFORE the ETH MAC clock)"
cores:
  - { name: cm7, arch: armv7em, fpu: true }
memories:
  - { name: flash, kind: flash, base: "0x08000000", size: 2097152 }
  - { name: sram, kind: ram, base: "0x20000000", size: 524288 }
peripherals:
  rcc:
    ip: st/rcc_f7
    base: "0x40023800"
    irq: RCC
  flash:
    ip: st/flash_f7
    base: "0x40023C00"
    irq: FLASH
  iwdg:
    ip: st/iwdg_v2
    base: "0x40003000"
  gpioa:
    ip: st/gpio_v2
    base: "0x40020000"
    gate: { peripheral: rcc, register: AHB1ENR, bit: 0 }
  gpiob:
    ip: st/gpio_v2
    base: "0x40020400"
    gate: { peripheral: rcc, register: AHB1ENR, bit: 1 }
  gpioc:
    ip: st/gpio_v2
    base: "0x40020800"
    gate: { peripheral: rcc, register: AHB1ENR, bit: 2 }
  gpiod:
    ip: st/gpio_v2
    base: "0x40020C00"
    gate: { peripheral: rcc, register: AHB1ENR, bit: 3 }
  gpiog:
    ip: st/gpio_v2
    base: "0x40021800"
    gate: { peripheral: rcc, register: AHB1ENR, bit: 6 }
  usart3:
    ip: st/usart_v3
    base: "0x40004800"
    gate: { peripheral: rcc, register: APB1ENR, bit: 18 }
    irq: USART3
    kernel_clock: apb
  eth:
    ip: st/eth_v1
    base: "0x40028000"
    gate: { peripheral: rcc, register: AHB1ENR, bit: 25 }   # ETHMACEN (block enable; HAL adds TX/RX EN bits 26/27)
    irq: ETH
    kernel_clock: ahb          # STM32F7 ETH MAC is clocked from HCLK/AHB
    # RMII bank is fixed by the die + package: STM32 RMII is AF11. A board only
    # chooses to WIRE Ethernet, not these pins. Nucleo-F767ZI (MB1137):
    #   pa1=REF_CLK pa2=MDIO pc1=MDC pa7=CRS_DV pc4=RXD0 pc5=RXD1
    #   pg11=TX_EN pg13=TXD0 pb13=TXD1
    rmii:
      af: 11
      pins: [pa1, pa2, pc1, pa7, pc4, pc5, pg11, pg13, pb13]
    # RMII-vs-MII select lives in SYSCFG_PMC (OUTSIDE the ETH block) on STM32 —
    # a per-chip fact carried as data so no silicon address sits in the HAL. The
    # generated eth_configure_pins() enables SYSCFG's clock, then sets the bit.
    # (The SAME70 GMAC has no such field: its select is in the MAC's own UR reg.)
    rmii_select:
      addr: "0x40013804"    # SYSCFG_PMC
      bit: 23               # MII_RMII_SEL (1 = RMII)
      clock: { addr: "0x40023844", bit: 14 }   # RCC_APB2ENR.SYSCFGEN — enable first
pins:
  pa1: { port: a, index: 1 }
  pa2: { port: a, index: 2 }
  pa7: { port: a, index: 7 }
  pb0: { port: b, index: 0 }
  pb13: { port: b, index: 13 }
