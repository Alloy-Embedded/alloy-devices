clock:
  sources:
    xtal40m:
      hz: 40000000
  boot_source: xtal40m
  profiles:
    bootloader_defaults:
      description: "Clocks exactly as the factory ESP-IDF bootloader leaves them (CPU 80 MHz, APB 80 MHz\
        \ \u2014 proven by old-alloy's HW-validated 500 ms blink calibration). The program only performs\
        \ the MANDATORY watchdog disables: unlock (0x50D83AA1) / clear / relock for TIMG0, TIMG1 and the\
        \ RTC WDT, as single whole-register writes.\n"
      sysclk_hz: 80000000
      ahb_hz: 80000000
      apb_hz: 80000000
      program:
      - op: write
        peripheral: timg0
        register: WDTWPROTECT
        value: '0x50D83AA1'
      - op: write
        peripheral: timg0
        register: WDTCONFIG0
        value: '0x0'
      - op: write
        peripheral: timg0
        register: WDTWPROTECT
        value: '0x0'
      - op: write
        peripheral: timg1
        register: WDTWPROTECT
        value: '0x50D83AA1'
      - op: write
        peripheral: timg1
        register: WDTCONFIG0
        value: '0x0'
      - op: write
        peripheral: timg1
        register: WDTWPROTECT
        value: '0x0'
      - op: write
        peripheral: rtc_cntl
        register: WDTWPROTECT
        value: '0x50D83AA1'
      - op: write
        peripheral: rtc_cntl
        register: WDTCONFIG0
        value: '0x0'
      - op: write
        peripheral: rtc_cntl
        register: WDTWPROTECT
        value: '0x0'
