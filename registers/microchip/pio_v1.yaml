schema: alloy.registers.v1
vendor: microchip
ip: pio_v1
class: gpio
description: >
  SAM parallel I/O controller (E70/S70/V71 era). Almost everything is
  write-only SET/CLEAR register pairs (PER/PDR, OER/ODR, SODR/CODR,
  PUER/PUDR...) — drivers write masks, never RMW those. Peripheral function
  select is TWO rw registers (ABCDSR1/ABCDSR2): function encoding
  A={0,0} B={1,0} C={0,1} D={1,1} as (ABCDSR1 bit, ABCDSR2 bit) — af values
  0..3 with bit0->ABCDSR1, bit1->ABCDSR2. Bit-per-pin registers carry no
  field entries; drivers shift by pin index.
provenance:
  sources:
    - "alloy-devices-yml vendors/microchip/same70/devices/atsame70q21b.yml templates.pio (SVD-derived)"
    - "old-alloy git 8b1b1bc7^ routes.hpp + driver_semantics/gpio.hpp (hardware-validated register usage: SODR 0x30, PUER 0x64, ABCDSR1/2 0x70/0x74)"
  completeness: bring-up-subset
  verified:
    - "The old canonical YAML flattened ABCDSR into a single entry at 0x70; silicon and the hardware-validated route code use TWO registers 0x70/0x74 — modeled correctly here"
