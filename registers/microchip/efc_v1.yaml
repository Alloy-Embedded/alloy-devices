schema: alloy.registers.v1
vendor: microchip
ip: efc_v1
class: flash
description: >
  SAM E70 embedded flash controller — bring-up subset (FMR wait states,
  needed by clock programs before raising the core clock).
provenance:
  sources:
    - "alloy-devices-yml vendors/microchip/same70/devices/atsame70q21b.yml templates.efc (SVD-derived)"
    - "old-alloy git 8b1b1bc7^ system_clock.hpp kEfcFmrRegister/kEfcFwsField (hardware-validated: FWS bit 8 width 4)"
  completeness: bring-up-subset
registers:
  - name: FMR
    offset: "0x00"
    access: rw
    fields:
      - { name: FRDY, bit: 0 }
      - { name: FWS, bit: 8, width: 4 }
      - { name: SCOD, bit: 16 }
      - { name: CLOE, bit: 26 }
  - name: FCR
    offset: "0x04"
    access: wo
  - name: FSR
    offset: "0x08"
    access: ro
  - name: FRR
    offset: "0x0C"
    access: ro
