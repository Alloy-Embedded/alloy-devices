schema: alloy.registers.v1
vendor: st
ip: flash_l4
class: flash
description: >
  STM32L4 flash interface. ACR carries the wait states every clock program
  must raise BEFORE switching sysclk up (3 WS at 64 MHz range 1 per RM0394
  table 9), plus the program/erase subset the flash HAL driver consumes: KEYR
  unlock (same magic keys as G0), SR busy/error flags (the L4 adds MISERR/
  FASTERR/RDERR/OPTVERR over the G0 set), CR page-erase and double-word
  program (PNB is 8 bits at [10:3], BKER bit 11, START bit 16 — all three
  positions differ from G0), and OPTR (RDP level, IWDG modes, DUALBANK on the
  1 MB parts; option-byte PROGRAMMING is a later, deliberate API).
provenance:
  sources:
    - "embassy-rs/stm32-data-generated @ 669003ee data/registers/flash_l4.json (all offsets and SR/CR/OPTR field positions; ACR LATENCY [2:0])"
    - "RM0394 rev 4 §3.3.3: 64 MHz @ range 1 needs LATENCY=3 (0WS<=16, 1WS<=32, 2WS<=48, 3WS<=64)"
  completeness: bring-up-subset
registers:
  - name: ACR
    offset: "0x00"
    access: rw
    fields:
      - { name: LATENCY, bit: 0, width: 3, description: "3 WS required at 64 MHz range 1" }
      - { name: PRFTEN, bit: 8 }
      - { name: ICEN, bit: 9 }
      - { name: DCEN, bit: 10 }
      - { name: ICRST, bit: 11 }
      - { name: DCRST, bit: 12 }
  - name: PDKEYR
    offset: "0x04"
    access: wo
  - name: KEYR
    offset: "0x08"
    access: wo
    description: "Unlock: write 0x45670123 then 0xCDEF89AB to clear CR.LOCK (same keys as G0)."
  - name: OPTKEYR
    offset: "0x0C"
    access: wo
  - name: SR
    offset: "0x10"
    access: rw
    fields:
      - { name: EOP, bit: 0 }
      - { name: OPERR, bit: 1 }
      - { name: PROGERR, bit: 3 }
      - { name: WRPERR, bit: 4 }
      - { name: PGAERR, bit: 5 }
      - { name: SIZERR, bit: 6 }
      - { name: PGSERR, bit: 7 }
      - { name: MISERR, bit: 8 }
      - { name: FASTERR, bit: 9 }
      - { name: RDERR, bit: 14 }
      - { name: OPTVERR, bit: 15 }
      - { name: BSY, bit: 16 }
  - name: CR
    offset: "0x14"
    access: rw
    fields:
      - { name: PG, bit: 0 }
      - { name: PER, bit: 1 }
      - { name: MER, bit: 2 }
      - { name: PNB, bit: 3, width: 8 }
      - { name: BKER, bit: 11 }
      - { name: START, bit: 16 }
      - { name: OPTSTRT, bit: 17 }
      - { name: OBL_LAUNCH, bit: 27 }
      - { name: OPTLOCK, bit: 30 }
      - { name: LOCK, bit: 31 }
  - name: ECCR
    offset: "0x18"
    access: rw
  - name: OPTR
    offset: "0x20"
    access: rw
    fields:
      - { name: RDP, bit: 0, width: 8 }
      - { name: IWDG_SW, bit: 16 }
      - { name: IWDG_STOP, bit: 17 }
      - { name: IWDG_STDBY, bit: 18 }
      - { name: DUALBANK, bit: 21, description: "1 MB parts only; reads 0 on single-bank dies (L412)" }
