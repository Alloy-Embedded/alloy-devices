schema: alloy.registers.v1
vendor: st
ip: dmamux_v1
class: dmamux
description: >
  ST DMAMUX1 request router (G0/G4/L4+/WB/H7 family; G0 base 0x40020800).
  One CCR per mux output channel at stride 4 from 0x00; mux channel i
  (0-based) drives DMA1 channel i+1, and on G0B1/G0C1 mux channels 7-11
  drive DMA2 channels 1-5. Modeled with the G0-family maximum of 12
  channels; usable count is chip data (G031/G041 = 5, G071/G081 = 7,
  G0B1/G0C1 = 12 — the G071RB SVD ships 7, the G0B1RE SVD wrongly ships
  only 7). Request generator block has 4 channels. DMAREQ_ID is 8 bits
  per RM0444/G071RB SVD (G0B1RE SVD wrongly narrows it to 6 bits, which
  cannot encode G0B1 request IDs up to 77; old-alloy HAL masked 7 bits,
  also sufficient). G0 request IDs (RM0444 §11.3.2 DMAMUX mapping table):
  0 = none/mem2mem, 1-4 = req_gen0-3, 5 = ADC, 6/7 = AES_IN/OUT,
  8/9 = DAC_CH1/CH2, 10/11 = I2C1_RX/TX, 12/13 = I2C2_RX/TX,
  14/15 = LPUART1_RX/TX, 16/17 = SPI1_RX/TX, 18/19 = SPI2_RX/TX,
  20-25 = TIM1_CH1..CH4/TRIG_COM/UP, 26-31 = TIM2_CH1..CH4/TRIG/UP,
  32-37 = TIM3_CH1..CH4/TRIG/UP, 38 = TIM6_UP, 39 = TIM7_UP,
  40-43 = TIM15_CH1/CH2/TRIG_COM/UP, 44-46 = TIM16_CH1/COM/UP,
  47-49 = TIM17_CH1/COM/UP, 50/51 = USART1_RX/TX, 52/53 = USART2_RX/TX,
  54/55 = USART3_RX/TX, 56/57 = USART4_RX/TX, 58/59 = UCPD1_RX/TX,
  60/61 = UCPD2_RX/TX; G0B1/G0C1 only: 62/63 = I2C3_RX/TX,
  64/65 = LPUART2_RX/TX, 66/67 = SPI3_RX/TX, 68-73 = TIM4_CH1..CH4/TRIG/UP,
  74/75 = USART5_RX/TX, 76/77 = USART6_RX/TX.
provenance:
  sources:
    - "alloy-devices-yml vendors/st/stm32g0/devices/stm32g071rb.yml templates.dmamux (SVD-derived) — CxCR/CSR/CFR/RGxCR/RGSR/RGCFR/HWCFGR offsets and all field bit positions; DMAREQ_ID bits 0-7"
    - "alloy-devices-yml vendors/st/stm32g0/devices/stm32g0b1re.yml templates.dmamux — same offsets; NOTE two SVD bugs: DMAREQ_ID narrowed to bits 0-5 and only 7 CxCR modeled although G0B1 hardware has 12 (RM0444)"
    - "RM0444 §11 (DMAMUX) — request-ID mapping table quoted in description, 12-channel count on G0B1/G0C1, 4 request generators"
    - "Zephyr DTS/overlay cross-checks (working configurations): ADC=5 (tests/drivers/adc/adc_api nucleo_g071rb), SPI1_RX=16/TX=17 (tests/drivers/spi/spi_loopback nucleo_g0b1re), USART1_RX=50/TX=51 (tests/drivers/uart/uart_elementary nucleo_g071rb); dts/arm/st/g0/stm32g0b1.dtsi dmamux1 dma-channels=12, dma2 dma-offset=7"
    - "old-alloy src/hal/dma/lite.hpp dmamux<Base> — one 32-bit CxCR per channel at stride 4, request-ID mask cross-check"
  completeness: bring-up-subset
registers:
  - name: CCR
    offset: "0x00"
    access: rw
    array: { count: 12, stride: 4 }
    description: "Mux channel i config; usable count is chip data (5/7/12 across G0)"
    fields:
      - { name: DMAREQ_ID, bit: 0, width: 8, description: "Peripheral request ID (see mapping table in IP description); 0 = no request" }
      - { name: SOIE, bit: 8, description: "Synchronization overrun interrupt enable" }
      - { name: EGE, bit: 9, description: "Event generation enable" }
      - { name: SE, bit: 16, description: "Synchronization enable" }
      - { name: SPOL, bit: 17, width: 2, description: "Sync polarity: 0 none, 1 rising, 2 falling, 3 both" }
      - { name: NBREQ, bit: 19, width: 5, description: "Number of requests minus 1 to forward per sync event" }
      - { name: SYNC_ID, bit: 24, width: 5, description: "Synchronization input selection" }
  - name: CSR
    offset: "0x80"
    access: ro
    fields:
      - { name: SOF, bit: 0, width: 12, description: "Sync overrun flag per mux channel (7 valid on G071/G081)" }
  - name: CFR
    offset: "0x84"
    access: wo
    fields:
      - { name: CSOF, bit: 0, width: 12, description: "Write 1 to clear SOF" }
  - name: RGCR
    offset: "0x100"
    access: rw
    array: { count: 4, stride: 4 }
    description: "Request generator channel g; output usable as DMAREQ_ID 1+g"
    fields:
      - { name: SIG_ID, bit: 0, width: 5, description: "Trigger input selection" }
      - { name: OIE, bit: 8, description: "Trigger overrun interrupt enable" }
      - { name: GE, bit: 16, description: "Generator enable" }
      - { name: GPOL, bit: 17, width: 2, description: "Trigger polarity: 0 none, 1 rising, 2 falling, 3 both" }
      - { name: GNBREQ, bit: 19, width: 5, description: "Number of requests minus 1 to generate per trigger" }
  - name: RGSR
    offset: "0x140"
    access: ro
    fields:
      - { name: OF, bit: 0, width: 4, description: "Trigger overrun flag per generator channel" }
  - name: RGCFR
    offset: "0x144"
    access: wo
    fields:
      - { name: COF, bit: 0, width: 4, description: "Write 1 to clear OF" }
  - name: HWCFGR2
    offset: "0x3EC"
    access: ro
    fields:
      - { name: NUM_DMA_EXT_REQ, bit: 0, width: 8 }
  - name: HWCFGR1
    offset: "0x3F0"
    access: ro
    description: "Hardware configuration introspection (present in G071RB SVD; absent from G0B1RE SVD)"
    fields:
      - { name: NUM_DMA_STREAMS, bit: 0, width: 8 }
      - { name: NUM_DMA_PERIPH_REQ, bit: 8, width: 8 }
      - { name: NUM_DMA_TRIG, bit: 16, width: 8 }
      - { name: NUM_DMA_REQGEN, bit: 24, width: 8 }
