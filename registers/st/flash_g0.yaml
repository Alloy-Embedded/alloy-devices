schema: alloy.registers.v1
vendor: st
ip: flash_g0
class: flash
description: >
  STM32G0 flash interface. ACR (wait-state ordering for clock programs) plus the
  program/erase subset (KEYR unlock, SR busy/error flags, CR page-erase and
  double-word program, OPTR dual-bank detection) used by the flash HAL driver.
  G0 programs one 64-bit double-word at a time, erases whole 2 KB pages; the
  512 KB parts (G0B1) are dual-bank so CR.BKER selects the bank and CR.PNB the
  page within it.
provenance:
  sources:
    - "alloy-devices-yml vendors/st/stm32g0/devices/stm32g071rb.yml templates.flash (SVD cmsis-svd:STM32G071.svd)"
    - "old-alloy commit 6d47f2cb (hardware-verified: ACR offset 0x00, LATENCY [2:0])"
    - "embassy-rs/stm32-data-generated @ 669003ee data/registers/flash_g0x1.json (KEYR/SR/CR/OPTR offsets + fields; RM0444 §3)"
  completeness: bring-up-subset
registers:
  - name: ACR
    offset: "0x00"
    access: rw
    fields:
      - { name: LATENCY, bit: 0, width: 3 }
      - { name: PRFTEN, bit: 8 }
      - { name: ICEN, bit: 9 }
      - { name: ICRST, bit: 11 }
      - { name: EMPTY, bit: 16 }
      - { name: DBG_SWEN, bit: 18 }
  - name: KEYR
    offset: "0x08"
    access: wo
    description: "Unlock: write 0x45670123 then 0xCDEF89AB to clear CR.LOCK."
  - name: SR
    offset: "0x10"
    access: rw
    fields:
      - { name: EOP, bit: 0 }
      - { name: OPERR, bit: 1 }
      - { name: PROGERR, bit: 3 }
      - { name: WRPERR, bit: 4 }
      - { name: PGAERR, bit: 5 }
      - { name: SIZERR, bit: 6 }
      - { name: PGSERR, bit: 7 }
      - { name: BSY, bit: 16 }
      - { name: CFGBSY, bit: 18 }
  - name: CR
    offset: "0x14"
    access: rw
    fields:
      - { name: PG, bit: 0 }
      - { name: PER, bit: 1 }
      - { name: MER, bit: 2 }
      - { name: PNB, bit: 3, width: 7 }
      - { name: BKER, bit: 13 }
      - { name: STRT, bit: 16 }
      - { name: EOPIE, bit: 24 }
      - { name: LOCK, bit: 31 }
  - name: OPTR
    offset: "0x20"
    access: ro
    fields:
      - { name: RDP, bit: 0, width: 8 }
      - { name: DUAL_BANK, bit: 21 }
