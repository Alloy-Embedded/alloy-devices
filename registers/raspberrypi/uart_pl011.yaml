schema: alloy.registers.v1
vendor: raspberrypi
ip: uart_pl011
class: uart
description: >
  ARM PrimeCell PL011 UART as integrated in the RP2040. Baud (pico-sdk
  formula): div = 8*kernel_hz/baud; IBRD = div>>7; FBRD = ((div & 0x7F)+1)/2.
  Kernel clock is clk_peri.
provenance:
  sources:
    - "alloy-devices-yml pico.yml templates.uart (SVD-derived offsets and field positions)"
    - "RP2040 datasheet §4.2 / PL011 TRM (baud formula; the old example hardcoded IBRD=67/FBRD=53 — FBRD=52 per the rounding formula)"
    - >-
      UARTDMACR's three fields: raspberrypi/pico-sdk @
      98a542c1a62fb549ffb5d66a3e5892b06276b670
      src/rp2040/hardware_regs/RP2040.svd (sha256
      1c72330127ae097c8c9a3661b509fcb9a94826d76a5c0d7e259eb605ddd7b0a6,
      2592282 bytes) — the SAME pinned file that sourced registers/raspberrypi/
      dma_v1.yaml and adc.yaml. UART0/UARTDMACR bitRanges, transcribed and not
      recalled. CROSS-CHECK against what this file already had: every register
      offset and every field bit already curated here re-parses IDENTICAL out of
      that SVD's UART0 node (script-compared, 0 mismatches), with one naming
      deviation that is not a defect — the SVD names the two whole-register baud
      fields BAUD_DIVINT/BAUD_DIVFRAC and this file has always called them
      DIVINT/DIVFRAC, same bits, same widths.
  completeness: bring-up-subset
registers:
  - name: UARTDR
    offset: "0x00"
    access: rw
    fields:
      - { name: DATA, bit: 0, width: 8 }
      - { name: FE, bit: 8 }
      - { name: PE, bit: 9 }
      - { name: BE, bit: 10 }
      - { name: OE, bit: 11 }
  - name: UARTRSR
    offset: "0x04"
    access: rw
  - name: UARTFR
    offset: "0x18"
    access: ro
    fields:
      - { name: BUSY, bit: 3 }
      - { name: RXFE, bit: 4 }
      - { name: TXFF, bit: 5 }
      - { name: RXFF, bit: 6 }
      - { name: TXFE, bit: 7 }
  - name: UARTILPR
    offset: "0x20"
    access: rw
  - name: UARTIBRD
    offset: "0x24"
    access: rw
    fields:
      - { name: DIVINT, bit: 0, width: 16 }
  - name: UARTFBRD
    offset: "0x28"
    access: rw
    fields:
      - { name: DIVFRAC, bit: 0, width: 6 }
  - name: UARTLCR_H
    offset: "0x2C"
    access: rw
    fields:
      - { name: BRK, bit: 0 }
      - { name: PEN, bit: 1 }
      - { name: EPS, bit: 2 }
      - { name: STP2, bit: 3 }
      - { name: FEN, bit: 4 }
      - { name: WLEN, bit: 5, width: 2 }
      - { name: SPS, bit: 7 }
  - name: UARTCR
    offset: "0x30"
    access: rw
    fields:
      - { name: UARTEN, bit: 0 }
      - { name: TXE, bit: 8 }
      - { name: RXE, bit: 9 }
      - { name: RTSEN, bit: 14 }
      - { name: CTSEN, bit: 15 }
  - name: UARTIFLS
    offset: "0x34"
    access: rw
  - name: UARTIMSC
    offset: "0x38"
    access: rw
    description: "Bit layout shared with UARTRIS/UARTMIS/UARTICR (PL011 TRM) — drivers reuse these masks for UARTICR writes"
    fields:
      - { name: RXIM, bit: 4 }
      - { name: RTIM, bit: 6, description: "Receive timeout — fires for FIFO residue below the trigger level" }
  - name: UARTICR
    offset: "0x44"
    access: wo
  - name: UARTDMACR
    offset: "0x48"
    access: rw
    description: >-
      DMA Control Register. The two enables are what route the FIFOs to the
      DMA's UART0_TX (TREQ_SEL 20) / UART0_RX (21) request lines, curated in
      chips/raspberrypi/rp2040.yaml as uart0's dma_requests. Nothing here says
      WHICH of the PL011's two request flavours (UARTRXDMASREQ, one word, vs
      UARTRXDMABREQ, a burst at the UARTIFLS trigger level) the RP2040 wires to
      TREQ_SEL 21 — the SVD names both in DMAONERR's text and picks neither.
      That gap matters to anything that wants a frame-gap event out of RTIM
      while DMA is draining the FIFO, and it is recorded rather than guessed.
    fields:
      - { name: RXDMAE, bit: 0, description: "Receive DMA enable: DMA for the receive FIFO is enabled" }
      - { name: TXDMAE, bit: 1, description: "Transmit DMA enable: DMA for the transmit FIFO is enabled" }
      - { name: DMAONERR, bit: 2, description: "The RX DMA requests (UARTRXDMASREQ/UARTRXDMABREQ) are disabled when the UART error interrupt is asserted" }
