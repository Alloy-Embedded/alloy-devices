schema: alloy.registers.v1
vendor: espressif
ip: uart_v1
class: uart
description: >
  ESP32 (LX6) UART. In the v1 ROM-configured mode the boot ROM/bootloader
  leaves UART0 at 115200 8N1 with pins routed — drivers only use FIFO and
  STATUS. TX FIFO is 128 deep; poll TXFIFO_CNT < 126 before writing.
provenance:
  sources:
    - "old-alloy boards/esp32_devkit/board_uart_raw.hpp (HW-validated: FIFO@base+0, STATUS@+0x1C, txfifo_cnt=(status>>16)&mask, threshold 126, no init)"
    - "uart-interrupt mining 2026-07-22: INT_RAW/ST/ENA/CLR @0x04-0x10 + CONF1 @0x24 do canonico esp32.yml; RX_TOUT_THRHD em byte-times no ESP32 classico; errata de leitura concorrente DPORT/FIFO (esp-idf usa alias AHB) - leitura APB validada em HW no spot-check"
    - "alloy-devices-yml esp32.yml uart block (fifo=0, status=28 with txfifo_cnt bits 16-23, clkdiv=20, conf0=32)"
    - "ESP32 TRM v4.6 §13.5 UART_CONF0_REG: PARITY[0], PARITY_EN[1], BIT_NUM[3:2], STOP_BIT_NUM[5:4] — NOT silicon-validated by alloy (no ESP32 on the bench); the offsets already were, the field positions are read from the TRM"
  completeness: bring-up-subset
registers:
  - name: FIFO
    offset: "0x00"
    access: rw
  - name: CLKDIV
    offset: "0x14"
    access: rw
    fields:
      - { name: CLKDIV, bit: 0, width: 20 }
      - { name: FRAG, bit: 20, width: 4 }
  - name: STATUS
    offset: "0x1C"
    access: ro
    fields:
      - { name: RXFIFO_CNT, bit: 0, width: 8 }
      - { name: TXFIFO_CNT, bit: 16, width: 8 }
  - name: CONF0
    offset: "0x20"
    access: rw
    description: >
      Frame shape. The boot ROM leaves this at 8N1; a driver that changes
      parity or stop bits read-modify-writes these fields and must not touch
      the rest of the register (the ROM owns the flow-control and loopback
      bits). STOP_BIT_NUM=3 is the TRM's two-stop-bit encoding; the classic
      ESP32 is known to need UART_RS485_CONF.DL1_EN for it to reach the wire,
      and that register is NOT in this file yet — see the driver's note.
    fields:
      - { name: PARITY, bit: 0, description: "0=even 1=odd (only meaningful with PARITY_EN=1)" }
      - { name: PARITY_EN, bit: 1 }
      - { name: BIT_NUM, bit: 2, width: 2, description: "data bits: 0=5 1=6 2=7 3=8" }
      - { name: STOP_BIT_NUM, bit: 4, width: 2, description: "1=1 stop, 2=1.5, 3=2 (see description)" }
  - name: INT_RAW
    offset: "0x04"
    access: ro
    fields:
      - { name: RXFIFO_FULL_INT_RAW, bit: 0 }
      - { name: TXFIFO_EMPTY_INT_RAW, bit: 1 }
      - { name: PARITY_ERR_INT_RAW, bit: 2 }
      - { name: FRM_ERR_INT_RAW, bit: 3 }
      - { name: RXFIFO_OVF_INT_RAW, bit: 4 }
      - { name: BRK_DET_INT_RAW, bit: 7 }
      - { name: RXFIFO_TOUT_INT_RAW, bit: 8 }
      - { name: TX_DONE_INT_RAW, bit: 14 }
  - name: INT_ST
    offset: "0x08"
    access: ro
    description: Masked status (raw AND ena) — read this in the ISR.
    fields:
      - { name: RXFIFO_FULL_INT_ST, bit: 0 }
      - { name: TXFIFO_EMPTY_INT_ST, bit: 1 }
      - { name: PARITY_ERR_INT_ST, bit: 2 }
      - { name: FRM_ERR_INT_ST, bit: 3 }
      - { name: RXFIFO_OVF_INT_ST, bit: 4 }
      - { name: BRK_DET_INT_ST, bit: 7 }
      - { name: RXFIFO_TOUT_INT_ST, bit: 8 }
      - { name: TX_DONE_INT_ST, bit: 14 }
  - name: INT_ENA
    offset: "0x0C"
    access: rw
    fields:
      - { name: RXFIFO_FULL_INT_ENA, bit: 0 }
      - { name: TXFIFO_EMPTY_INT_ENA, bit: 1 }
      - { name: PARITY_ERR_INT_ENA, bit: 2 }
      - { name: FRM_ERR_INT_ENA, bit: 3 }
      - { name: RXFIFO_OVF_INT_ENA, bit: 4 }
      - { name: BRK_DET_INT_ENA, bit: 7 }
      - { name: RXFIFO_TOUT_INT_ENA, bit: 8 }
      - { name: TX_DONE_INT_ENA, bit: 14 }
  - name: INT_CLR
    offset: "0x10"
    access: wo
    fields:
      - { name: RXFIFO_FULL_INT_CLR, bit: 0 }
      - { name: TXFIFO_EMPTY_INT_CLR, bit: 1 }
      - { name: PARITY_ERR_INT_CLR, bit: 2 }
      - { name: FRM_ERR_INT_CLR, bit: 3 }
      - { name: RXFIFO_OVF_INT_CLR, bit: 4 }
      - { name: BRK_DET_INT_CLR, bit: 7 }
      - { name: RXFIFO_TOUT_INT_CLR, bit: 8 }
      - { name: TX_DONE_INT_CLR, bit: 14 }
  - name: CONF1
    offset: "0x24"
    access: rw
    description: >-
      RX thresholds. RXFIFO_FULL fires when RXFIFO_CNT > RXFIFO_FULL_THRHD;
      RXFIFO_TOUT fires after RX idle for RX_TOUT_THRHD byte-times (classic
      ESP32 unit = one byte duration at current baud) with RX_TOUT_EN set.
    fields:
      - { name: RXFIFO_FULL_THRHD, bit: 0, width: 7 }
      - { name: TXFIFO_EMPTY_THRHD, bit: 8, width: 7 }
      - { name: RX_FLOW_THRHD, bit: 16, width: 7 }
      - { name: RX_FLOW_EN, bit: 23 }
      - { name: RX_TOUT_THRHD, bit: 24, width: 7 }
      - { name: RX_TOUT_EN, bit: 31 }
