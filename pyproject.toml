[project]
name = "alloy-devices"
version = "0.3.0"
description = "Curated, provenance-tracked register and chip database for the Alloy embedded framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luiz Carlos Gili" }]
keywords = ["embedded", "mcu", "svd", "registers", "device-database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Embedded Systems",
]
requires-python = ">=3.11"

dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/Alloy-Embedded/alloy-devices"
Repository = "https://github.com/Alloy-Embedded/alloy-devices"

[project.scripts]
alloy-devices = "alloy_devices.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/alloy_devices"]

# The wheel IS the database: chips/registers/schema ship as package data
# under alloy_devices/data/ (resolved via importlib.resources in loader.py,
# with the repo layout as a checkout-time fallback).
[tool.hatch.build.targets.wheel.force-include]
"chips" = "alloy_devices/data/chips"
"registers" = "alloy_devices/data/registers"
"schema" = "alloy_devices/data/schema"

[dependency-groups]
dev = ["pytest>=8.0"]
