[project]
name = "alloy-devices"
version = "0.1.0"
description = "Device database and validation pipeline for the Alloy framework"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.scripts]
alloy-devices = "alloy_devices.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/alloy_devices"]

[dependency-groups]
dev = ["pytest>=8.0"]
